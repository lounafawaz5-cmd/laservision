<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Outfit;font-weight:300;src:url(../../../brand/fonts/Outfit/Outfit-Light.ttf)}
@font-face{font-family:Outfit;font-weight:500;src:url(../../../brand/fonts/Outfit/Outfit-Medium.ttf)}
@font-face{font-family:Outfit;font-weight:700;src:url(../../../brand/fonts/Outfit/Outfit-Bold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:Outfit;overflow:hidden}
.s{width:1080px;height:1920px;position:relative;display:none}
.s.on{display:block}
.mark{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);width:460px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="cedar" viewBox="0 0 260 200">
  <g fill="#00A651">
   <path d="M130 2 L160 26 Q150 25 142 29 L130 22 L118 29 Q110 25 100 26 Z"/>
   <path d="M130 22 L184 56 Q168 53 156 59 L130 46 L104 59 Q92 53 76 56 Z"/>
   <path d="M130 46 L208 90 Q188 86 172 93 L130 74 L88 93 Q72 86 52 90 Z"/>
   <path d="M130 74 L232 128 Q206 122 186 131 L130 106 L74 131 Q54 122 28 128 Z"/>
   <path d="M130 106 L256 168 Q224 160 198 170 L130 140 L62 170 Q36 160 4 168 Z"/>
   <rect x="121" y="140" width="18" height="56" rx="2"/>
  </g>
 </symbol>
 <clipPath id="lensL"><rect x="40" y="40" width="380" height="300" rx="120"/></clipPath>
 <clipPath id="lensR"><rect x="580" y="40" width="380" height="300" rx="120"/></clipPath>
 <g id="flagfill">
  <rect x="-1000" y="0" width="4000" height="380" fill="#fff"/>
  <rect x="-1000" y="0" width="4000" height="105" fill="#ED1C24"/>
  <rect x="-1000" y="275" width="4000" height="105" fill="#ED1C24"/>
 </g>
</defs></svg>

<!-- A: white, glasses with the flag in the lenses -->
<div class="s" id="a" style="background:#fff">
 <div style="position:absolute;top:250px;width:100%;text-align:center;font-weight:500;font-size:40px;letter-spacing:10px;color:#000">22 · 11 · 1943</div>
 <svg style="position:absolute;top:470px;left:40px" width="1000" height="380" viewBox="0 0 1000 380">
  <g clip-path="url(#lensL)"><use href="#flagfill"/><use href="#cedar" x="135" y="110" width="190" height="146"/></g>
  <g clip-path="url(#lensR)"><use href="#flagfill"/><use href="#cedar" x="675" y="110" width="190" height="146"/></g>
  <g fill="none" stroke="#000" stroke-width="22" stroke-linecap="round">
   <rect x="40" y="40" width="380" height="300" rx="120"/>
   <rect x="580" y="40" width="380" height="300" rx="120"/>
   <path d="M420 150 Q500 100 580 150"/>
   <path d="M40 120 L4 104"/><path d="M960 120 L996 104"/>
  </g>
 </svg>
 <div style="position:absolute;top:1000px;width:100%;text-align:center;color:#000">
  <div style="font-weight:700;font-size:112px;line-height:1.02;letter-spacing:-2px">Lebanon<br>looks good<br>on you.</div>
  <div style="margin-top:44px;font-weight:300;font-size:46px">Happy Independence Day</div>
 </div>
 <img class="mark" src="../../../brand/zeiss/zvc-wordmark-dark.png">
</div>

<!-- B: black, big date, flag stripe -->
<div class="s" id="b" style="background:#000;color:#fff">
 <div style="position:absolute;top:300px;left:90px;font-weight:300;font-size:46px;letter-spacing:2px">Happy Independence Day</div>
 <div style="position:absolute;top:380px;left:80px;font-weight:700;font-size:330px;line-height:.95;letter-spacing:-12px">22<br>11</div>
 <div style="position:absolute;top:1060px;left:90px;width:900px;height:200px;display:flex;flex-direction:column">
  <div style="flex:1;background:#ED1C24"></div><div style="flex:1.1;background:#fff;position:relative"><svg style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)" width="120" height="92" viewBox="0 0 260 200"><use href="#cedar" width="260" height="200"/></svg></div><div style="flex:1;background:#ED1C24"></div>
 </div>
 <div style="position:absolute;top:1290px;left:90px;width:900px;font-weight:500;font-size:68px;line-height:1.15">Our favourite view<br>is still this one.</div>
 <div style="position:absolute;top:1480px;left:90px;font-weight:300;font-size:40px;opacity:.75">83 years of Lebanon.</div>
 <img class="mark" style="left:90px;transform:none;width:420px" src="../../../brand/zeiss/zvc-wordmark-white.png">
</div>
</body></html>
