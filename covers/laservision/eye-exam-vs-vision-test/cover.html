<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"MA";src:url("../../../reels/public/fonts/Montserrat-Arabic-Bold.woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;position:relative;overflow:hidden;background:#00303F;font-family:"MA",sans-serif}
.bg{position:absolute;inset:0;background:url("bg.jpg") 50% 0%/125% auto no-repeat}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,93,131,0) 46%,rgba(0,80,108,.55) 60%,rgba(0,62,84,.82) 74%,rgba(0,48,63,.9) 100%)}
.card{position:absolute;left:28px;top:760px;width:310px;height:290px;border-radius:40px;background:#F1F2F2;border:12px solid #fff;box-shadow:0 14px 40px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transform:rotate(-4deg)}
.circle{position:absolute;left:785px;top:780px;width:268px;height:268px;border-radius:50%;background:#00303F;border:12px solid #fff;box-shadow:0 14px 40px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.pill{position:absolute;padding:10px 30px;border-radius:40px;background:#005D83;border:6px solid #fff;color:#fff;font-size:34px;letter-spacing:1px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.p1{left:58px;top:1022px;transform:rotate(-3deg)}
.p2{right:30px;top:1022px;transform:rotate(3deg)}
.txt{position:absolute;left:0;right:0;top:1180px;text-align:center;color:#fff;text-shadow:0 0 10px rgba(48,164,191,.9),0 0 26px rgba(48,164,191,.6),0 0 44px rgba(0,93,131,.6)}
.h{font-size:108px;line-height:1.08}
.s{margin-top:44px;font-size:50px}
</style></head><body>
<!-- LaserVision · Eye exam vs vision test reel (IMG_1389, 13 Nov). Background: IMG_1389.mov at 0:01.2
     (mouth closed, soft smile, eyes to camera). Render: Playwright screenshot at 1080×1920. -->
<div class="bg"></div><div class="scrim"></div>
<!-- Left sticker: eye chart (the vision test) -->
<div class="card"><svg width="190" height="190" viewBox="0 0 100 100">
 <rect x="20" y="6" width="60" height="88" rx="8" fill="#fff" stroke="#00303F" stroke-width="4"/>
 <text x="50" y="36" text-anchor="middle" font-family="MA" font-weight="700" font-size="26" fill="#005D83">E</text>
 <text x="50" y="54" text-anchor="middle" font-family="MA" font-weight="700" font-size="14" fill="#00303F" letter-spacing="2">F P</text>
 <text x="50" y="69" text-anchor="middle" font-family="MA" font-weight="700" font-size="10" fill="#00303F" letter-spacing="2">T O Z</text>
 <text x="50" y="82" text-anchor="middle" font-family="MA" font-weight="700" font-size="7" fill="#00303F" letter-spacing="2">L P E D</text>
</svg></div>
<div class="pill p1">VISION TEST</div>
<!-- Right sticker: cross-section of the eye (the full exam: cornea, lens, retina, optic nerve) -->
<div class="circle"><svg width="214" height="214" viewBox="0 0 200 200">
 <circle cx="108" cy="100" r="62" fill="#fff" stroke="#B6DFE5" stroke-width="6"/>
 <path d="M166 84 L196 78 L196 122 L166 116 Z" fill="#30A4BF" stroke="#B6DFE5" stroke-width="5"/>
 <path d="M136 46 A56 56 0 0 1 136 154" fill="none" stroke="#30A4BF" stroke-width="10" stroke-linecap="round"/>
 <path d="M60 64 Q24 100 60 136" fill="#B6DFE5" stroke="#30A4BF" stroke-width="8" stroke-linecap="round"/>
 <line x1="58" y1="70" x2="58" y2="86" stroke="#005D83" stroke-width="7" stroke-linecap="round"/>
 <line x1="58" y1="114" x2="58" y2="130" stroke="#005D83" stroke-width="7" stroke-linecap="round"/>
 <ellipse cx="70" cy="100" rx="10" ry="24" fill="#B6DFE5" stroke="#00303F" stroke-width="5"/>
</svg></div>
<div class="pill p2">EYE HEALTH</div>
<div class="txt"><div class="h">SEEING WELL<br>ISN'T ENOUGH</div><div class="s">Vision test vs full eye exam</div></div>
</body></html>
